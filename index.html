<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub IA Familiar</title>
    <link rel="manifest" href="/appRei/manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            background-color: #030712;
        }
        .card-active:active {
            background-color: #1f2937;
            transform: scale(0.97);
        }
        /* Pisca apenas no erro */
        .status-alert {
            animation: blink 1.2s infinite;
            border-color: #ef4444;
            color: #ef4444;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen flex flex-col justify-center p-6 relative">

    <button onclick="salvarChave()" id="status-btn" 
            class="absolute top-6 right-4 px-3 py-1 rounded-full border text-[9px] font-bold tracking-tighter transition-all active:scale-90">
        <span id="status-text">VERIFICANDO</span>
    </button>

    <header class="mb-10 text-center shrink-0">
        <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">
            Hub IA Familiar
        </h1>
        <p class="text-gray-500 mt-2 text-xs uppercase tracking-[0.2em] font-light">Seus assistentes em um só lugar</p>
    </header>

    <div class="grid grid-cols-1 gap-4 max-w-md mx-auto w-full">
        
        <a href="legendas/index.html" class="bg-gray-900 p-5 rounded-3xl border border-gray-800 flex items-center gap-4 transition-all card-active">
            <span class="text-3xl">📸</span>
            <div>
                <h2 class="font-bold text-lg text-blue-400">Legendas Instagram</h2>
                <p class="text-gray-500 text-xs">Seu post do seu jeito!</p>
            </div>
        </a>

        <a href="reforco/index.html" class="bg-gray-900 p-5 rounded-3xl border border-gray-800 flex items-center gap-4 transition-all card-active">
            <span class="text-3xl">🎓</span>
            <div>
                <h2 class="font-bold text-lg text-indigo-400">Aula de Reforço</h2>
                <p class="text-gray-500 text-xs">Apoio pedagógico para banca!</p>
            </div>
        </a>

    </div>

    <script>
        function atualizarStatus() {
            const btn = document.getElementById("status-btn");
            const text = document.getElementById("status-text");
            const key = localStorage.getItem("gemini_key");
            
            if (key && key.length > 10) {
                // MODO: ONLINE (Limpo, Verde, Sem Piscar)
                btn.className = "absolute top-6 right-4 px-3 py-1 rounded-full border border-green-900 text-green-600 opacity-60 transition-all active:scale-90";
                text.innerText = "API ON";
            } else {
                // MODO: CONFIG (Vermelho, Piscando)
                btn.className = "absolute top-6 right-4 px-3 py-1 rounded-full border text-red-500 transition-all active:scale-90 status-alert";
                text.innerText = "INSIRA API";
            }
        }

        function salvarChave() {
            const currentKey = localStorage.getItem("gemini_key") || "";
            const key = prompt("API Key:", currentKey);
            if(key !== null) {
                localStorage.setItem("gemini_key", key.trim());
                atualizarStatus();
            }
        }

        atualizarStatus();

        if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/appRei/sw.js')
      .then(() => console.log('Service Worker registrado!'))
      .catch(err => console.error('Erro SW:', err));
}

    </script>
</body>
</html>
