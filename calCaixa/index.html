<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Calculadora de Corte de Caixa</title>

<style>
    :root {
        --bg: #f4f6f9;
        --card: #ffffff;
        --text: #222;
        --primary: #4a90e2;
        --secondary: #e4e7ec;
    }

    body.dark {
        --bg: #1e1f26;
        --card: #2c2f3a;
        --text: #f4f4f4;
        --primary: #5dade2;
        --secondary: #3a3d4a;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        transition: 0.3s;
    }

    .calculator {
        background: var(--card);
        padding: 25px;
        border-radius: 15px;
        width: 300px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        transition: 0.3s;
    }

    h2 {
        text-align: center;
        margin-bottom: 15px;
    }

    input {
        width: 93%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid var(--secondary);
        font-size: 16px;
        background: var(--secondary);
        color: var(--text);
        outline: none;
    }

    .buttons {
        display: flex;
        gap: 8px;
        margin-top: 10px;
    }

    button {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    .calc { background: var(--primary); color: white; }
    .clear { background: #e74c3c; color: white; }
    .copy { background: #2ecc71; color: white; }
    .darkmode { background: #555; color: white; margin-left: 95px;  }

    button:hover { opacity: 0.85; }

    .result {
        margin-top: 15px;
        background: var(--secondary);
        padding: 10px;
        border-radius: 8px;
        font-size: 14px;
        
        min-height: 60px;
        white-space: pre-line;
    }
</style>
</head>

<body>

<div class="calculator">
    <a href="../index.html"> <button  class="clear" >← Voltar</button> </a>
    <button class="darkmode" onclick="toggleDark()" >🌙 Modo Escuro</button>   
    
    <h2>📦 Corte de Caixa</h2>

    <input type="number" id="comprimento" placeholder="Comprimento (cm)" step="any">
    <input type="number" id="largura" placeholder="Largura (cm)" step="any">
    <input type="number" id="altura" placeholder="Altura (cm)" step="any">

    <div class="buttons">
        <button class="calc" onclick="calcular()">Calcular</button>
        <button class="clear" onclick="limpar()">Limpar</button>
        <button class="copy" onclick="copiar()">Copiar</button>
    </div>

    <div class="result" id="resultado"></div>
</div>

<script>
function calcular() {
    const c = parseFloat(document.getElementById('comprimento').value) || 0;
    const l = parseFloat(document.getElementById('largura').value) || 0;
    const a = parseFloat(document.getElementById('altura').value) || 0;

    const baseComp = c + 2 * a;
    const baseLarg = l + 2 * a;
    const baseAlt = a;

    const tampaComp = c + a;
    const tampaLarg = l + a;
    const tampaAlt = a / 2;

    const lenteComp = c - 2;
    const lenteLarg = l - 2;
   const folhaW = 66;
const folhaH = 48;

// Função que testa se duas peças cabem na folha (considerando rotação)
function cabemNaFolha(w1, h1, w2, h2) {
    const possibilidades = [
        // lado a lado horizontal
        (w1 + w2 <= folhaW && Math.max(h1, h2) <= folhaH),
        // lado a lado vertical
        (h1 + h2 <= folhaH && Math.max(w1, w2) <= folhaW),

        // peças rotacionadas
        (h1 + w2 <= folhaW && Math.max(w1, h2) <= folhaH),
        (w1 + h2 <= folhaW && Math.max(h1, w2) <= folhaH),

        (h2 + w1 <= folhaW && Math.max(w2, h1) <= folhaH),
        (w2 + h1 <= folhaW && Math.max(h2, w1) <= folhaH)
    ];

    return possibilidades.some(v => v);
}

// dimensões das peças
const baseW = baseComp;
const baseH = baseLarg;

const tampaW = tampaComp;
const tampaH = tampaLarg;

// verifica se base + tampa cabem juntos
const cabemJuntas = cabemNaFolha(baseW, baseH, tampaW, tampaH);

// verifica se cada uma cabe sozinha
const baseSozinha = (baseW <= folhaW && baseH <= folhaH) || (baseH <= folhaW && baseW <= folhaH);
const tampaSozinha = (tampaW <= folhaW && tampaH <= folhaH) || (tampaH <= folhaW && tampaW <= folhaH);

let folhasNecessarias = 2;

if (cabemJuntas) {
    folhasNecessarias = "1 Folha";
} else if (baseSozinha && tampaSozinha) {
    folhasNecessarias = "2 Folhas";
} else {
    folhasNecessarias = "Não cabe na folha 48x66";
}

    const resultadoTexto = 
`<strong>*Base:*</strong> ${baseComp.toFixed(2)} cm x ${baseLarg.toFixed(2)} cm
*Altura da base:* ${baseAlt} cm

<strong>*Tampa:*</strong> ${tampaComp.toFixed(2)} cm x ${tampaLarg.toFixed(2)} cm
*Altura da Tampa:* ${tampaAlt.toFixed(2)} cm

<strong>*Lente:*</strong> ${lenteComp.toFixed(2)} cm x ${lenteLarg.toFixed(2)} cm -> 2cm
<strong>*Folhas necessárias:*</strong> ${folhasNecessarias}`;

    document.getElementById('resultado').innerHTML = resultadoTexto;
}

function limpar() {
    document.getElementById('comprimento').value = "";
    document.getElementById('largura').value = "";
    document.getElementById('altura').value = "";
    document.getElementById('resultado').innerHTML = "";
}

function copiar() {
    const texto = document.getElementById('resultado').innerText;
    if(texto) {
        navigator.clipboard.writeText(texto);
        alert("Resultado copiado!");
    }
}

function toggleDark() {
    document.body.classList.toggle('dark');
}
</script>

</body>
</html>
