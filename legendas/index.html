<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Gerador de Legendas</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background-color: #111827; }
        #app-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        #chat { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 1rem; }
        footer { flex-shrink: 0; background: #1f2937; border-top: 1px solid #374151; padding-bottom: env(safe-area-inset-bottom); }
        
        /* Estilo para as bolinhas de carregamento */
        .typing-dots { display: inline-flex; align-items: center; gap: 4px; }
        .dot { width: 6px; height: 6px; background: #3b82f6; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
        
        input { font-size: 16px !important; color: white; }
    </style>
</head>
<body class="text-white">

    <div id="app-container">
        <header class="p-4 bg-gray-900 flex justify-between items-center border-b border-gray-800 shrink-0">
            <a href="../index.html" class="text-blue-500 text-sm font-medium">← Voltar</a>
            <h1 class="font-bold">Legendas IA</h1>
            <div class="w-10"></div>
        </header>

        <main id="chat" class="space-y-4">
            <div class="bg-gray-800 p-3 rounded-2xl rounded-tl-none text-sm text-gray-400 italic max-w-[85%] border border-gray-700 shadow-sm">
                Sobre o que vamos criar uma legenda hoje?
            </div>
        </main>

        <footer class="p-3">
            <div class="max-w-4xl mx-auto flex items-center gap-2">
                <input type="text" id="input" placeholder="Sobre o que é o post?" 
                       class="flex-1 bg-gray-700 border border-gray-600 p-3 rounded-full outline-none focus:border-blue-500 shadow-sm text-white"
                       autocomplete="off" autocorrect="off" spellcheck="false">
                
                <button onclick="gerar()" id="btn" 
                        class="bg-blue-600 text-white p-3 rounded-full w-12 h-12 flex items-center justify-center shadow-lg active:scale-90 shrink-0 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9-2-9-18-9 18 9 2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";
        import { GEMINI_KEY } from "../config.js";
        // Função global de cópia (ajustada para remover <br>)
        window.copiarTexto = (btn, textoComBr) => {
            const textoLimpo = textoComBr.replace(/<br>/g, '\n');
            navigator.clipboard.writeText(textoLimpo).then(() => {
                const originalText = btn.innerHTML;
                btn.innerText = "Copiado!";
                btn.classList.replace('bg-gray-600', 'bg-green-600');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.replace('bg-green-600', 'bg-gray-600');
                }, 2000);
            });
        };

        window.gerar = async () => {
            const input = document.getElementById("input");
            const chat = document.getElementById("chat");
            const btn = document.getElementById("btn");

            const textoUser = input.value.trim();
            if (!textoUser) return;

            input.value = "";
            btn.disabled = true;

            // 1. Mostra a ideia do usuário no chat
            chat.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-gray-800 text-gray-400 p-3 rounded-2xl rounded-tr-none max-w-[85%] border border-gray-700 text-sm">
                        <b>Ideia:</b> ${textoUser}
                    </div>
                </div>`;
            chat.scrollTop = chat.scrollHeight;

            // 2. Indicador de carregamento (dots)
            const aguarde = document.createElement("div");
            aguarde.id = "status-aguarde";
            aguarde.className = "flex justify-start";
            aguarde.innerHTML = `
                <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-3">
                    <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                </div>`;
            chat.appendChild(aguarde);
            chat.scrollTop = chat.scrollHeight;

            try {
                const genAI = new GoogleGenerativeAI(GEMINI_KEY);
                const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash-lite" });

                const CONTEXTO = "Crocheteira: Debora Santos - Art Croche. TOM: Profissional e Amigável. CTA: Link na Bio.";
                const promptFinal = `Atue como Copywriter. Contexto: ${CONTEXTO}. Crie uma legenda em português para: ${textoUser}. Obrigatório seguir a lógica: Gancho, Conteúdo, CTA e Hashtags. Retorne SOMENTE a legenda pronta para uso, sem comentários adicionais.`;

                const result = await model.generateContent(promptFinal);
                const response = await result.response;
                const respostaTexto = response.text().trim();

                if (document.getElementById("status-aguarde")) document.getElementById("status-aguarde").remove();

                const textoFormatado = respostaTexto.replace(/\n/g, '<br>');

                // 3. Mostra a legenda gerada com botão de cópia
                chat.innerHTML += `
                    <div class="flex flex-col items-start space-y-2">
                        <div class="bg-white text-gray-900 p-4 rounded-2xl rounded-tl-none max-w-[85%] shadow-xl text-sm leading-relaxed">
                            ${textoFormatado}
                        </div>
                        <button onclick="copiarTexto(this, \`${textoFormatado}\`)" 
                                class="bg-gray-600 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 active:scale-95 transition">
                            📋 Copiar Legenda
                        </button>
                    </div>`;

            } catch (e) {
                if (document.getElementById("status-aguarde")) document.getElementById("status-aguarde").remove();
                chat.innerHTML += `
                    <div class="bg-red-600 p-3 rounded-xl text-white max-w-[85%]">
                        <b>Erro:</b> ${e.message || "Erro desconhecido."}
                    </div>
                `;
            } finally {
                btn.disabled = false;
                chat.scrollTop = chat.scrollHeight;
                input.focus();
            }
        };

        // Enviar com Enter
        document.getElementById("input").addEventListener("keypress", (e) => {
            if (e.key === "Enter") window.gerar();
        });

        // Script Visual Viewport para fixar o input no teclado (Modo App)
        const vvp = window.visualViewport;
        const appContainer = document.getElementById('app-container');
        function resizeApp() {
            if (!vvp) return;
            appContainer.style.height = vvp.height + 'px';
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }
        if (vvp) {
            vvp.addEventListener('resize', resizeApp);
            window.addEventListener('load', resizeApp);
        }
    </script>
</body>
</html>
