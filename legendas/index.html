<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Legendas</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col">
    <div class="p-4 border-b border-gray-800 flex justify-between items-center">
        <a href="../index.html" class="text-blue-500">← Voltar</a>
        <h1 class="font-bold">Legendas IA</h1>
    </div>

    <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

    <div class="p-4 bg-gray-800">
        <textarea id="input" placeholder="Sobre o que é o post?" class="w-full bg-gray-700 p-3 rounded-xl mb-2 outline-none text-white"></textarea>
        <button onclick="gerar()" id="btn" class="w-full bg-blue-600 p-4 rounded-xl font-bold">Gerar Legenda</button>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // Função global de cópia
        window.copiarTexto = (btn, texto) => {
            // Remove as tags <br> para copiar o texto limpo
            const textoLimpo = texto.replace(/<br>/g, '\n');
            navigator.clipboard.writeText(textoLimpo).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "Copiado!";
                btn.classList.replace('bg-gray-600', 'bg-green-600');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.replace('bg-green-600', 'bg-gray-600');
                }, 2000);
            });
        };

        window.gerar = async () => {
            const input = document.getElementById("input");
            const chat = document.getElementById("chat");
            const btn = document.getElementById("btn");
            const apiKey = localStorage.getItem("gemini_key");

            const textoUser = input.value;
            if (!textoUser || !apiKey) return alert("Verifique o texto ou a chave API");

            input.value = "";
            btn.disabled = true;

            // 1. Mostra a pergunta do usuário
            chat.innerHTML += `<div class="bg-gray-800 p-3 rounded-lg mb-2 text-sm text-gray-400"><b>Ideia:</b> ${textoUser}</div>`;

            // 2. Cria o indicador de aguarde
            const aguarde = document.createElement("div");
            aguarde.id = "status-aguarde";
            aguarde.innerText = "Gerando sua legenda, aguarde...";
            aguarde.className = "text-blue-400 italic p-2 text-sm";
            chat.appendChild(aguarde);
            chat.scrollTop = chat.scrollHeight;

            try {
                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash-latest" });

                const CONTEXTO = "Crocheteira: Debora Santos - Art Croche. TOM: Profissional e Amigável. CTA: Link na Bio.";
                const promptFinal = `Atue como Copywriter. Contexto: ${CONTEXTO}. Crie uma legenda para: ${textoUser}. Estruture com Gancho, Conteúdo, CTA e Hashtags. Retorne SOMENTE a legenda pronta para uso, sem comentários adicionais.`;

                const result = await model.generateContent(promptFinal);
                const response = await result.response;
                const respostaTexto = response.text().trim();

                // 3. Remove o "aguarde..."
                const status = document.getElementById("status-aguarde");
                if (status) status.remove();

                // 4. Mostra a resposta com o BOTÃO DE COPIAR
                // Geramos um ID único para cada resposta se necessário, ou passamos o texto direto
                const idDiv = 'msg-' + Date.now();
                const textoFormatado = respostaTexto.replace(/\n/g, '<br>');

                chat.innerHTML += `
                    <div class="bg-white text-gray-900 p-4 rounded-lg mb-2 shadow-lg" id="${idDiv}">
                        ${textoFormatado}
                    </div>
                    <button onclick="copiarTexto(this, \`${textoFormatado}\`)" 
                            class="bg-gray-600 text-white px-4 py-2 rounded-lg text-sm font-bold mb-6 flex items-center gap-2 active:scale-95 transition">
                        📋 Copiar Legenda
                    </button>
                `;

            } catch (e) {
                const status = document.getElementById("status-aguarde");
                if (status) status.remove();
                alert("Erro: " + e.message);
            } finally {
                btn.disabled = false;
                chat.scrollTop = chat.scrollHeight;
            }
        }
    </script>
</body>
</html>
