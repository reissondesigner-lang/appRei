<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Legendas</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col">
    <div class="p-4 border-b border-gray-800 flex justify-between items-center">
        <a href="../index.html" class="text-blue-500">← Voltar</a>
        <h1 class="font-bold">Legendas IA</h1>
    </div>

    <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

    <div class="p-4 bg-gray-800">
        <textarea id="input" placeholder="Sobre o que é o post?" class="w-full bg-gray-700 p-3 rounded-xl mb-2 outline-none"></textarea>
        <button onclick="gerar()" id="btn" class="w-full bg-blue-600 p-4 rounded-xl font-bold">Gerar Legenda</button>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";
        
        const CONTEXTO = "EMPRESA: Debora Santos - Art Croche. TOM: Profissional e Amigável. CTA: Link na Bio.";
 const prompt = `Atue como Copywriter. Contexto: ${CONTEXTO}. Crie uma legenda para: ${textoUser}. Estruture com Gancho, Conteúdo, CTA e Hashtags. retorne somente a legenda pronta para uso sem mais textos`;
                
        window.enviar = async () => {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");
    const btn = document.getElementById("btn");
    const apiKey = localStorage.getItem("gemini_key");
    
    const texto = input.value;
    if (!texto || !apiKey) return;

    input.value = "";
    btn.disabled = true;

    // 1. Mostra a pergunta do usuário
    chat.innerHTML += `<div class="bg-blue-100 p-3 rounded-lg mb-2"><b>Você:</b> ${texto}</div>`;
    
    // 2. Cria o indicador de aguarde
    const aguarde = document.createElement("div");
    aguarde.id = "status-aguarde";
    aguarde.innerText = "aguarde...";
    aguarde.className = "text-gray-500 italic p-2"; // apenas uma cor cinza discreta
    chat.appendChild(aguarde);
    chat.scrollTop = chat.scrollHeight;

    try {
        const genAI = new GoogleGenerativeAI(apiKey);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash-latest" });
        
        const result = await model.generateContent(texto);
        const response = await result.response;
        const respostaTexto = response.text();

        // 3. Remove o "aguarde..."
        const status = document.getElementById("status-aguarde");
        if (status) status.remove();
        
        // 4. Mostra a resposta
        chat.innerHTML += `<div class="bg-white border p-3 rounded-lg mb-4">${respostaTexto.replace(/\n/g, '<br>')}</div>`;

    } catch (e) {
        const status = document.getElementById("status-aguarde");
        if (status) status.remove();
        alert("Erro: " + e.message);
    } finally {
        btn.disabled = false;
        chat.scrollTop = chat.scrollHeight;
    }
}
    </script>
</body>
</html>
