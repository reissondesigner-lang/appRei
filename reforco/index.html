<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestra de Reforço</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-indigo-50 text-gray-900 h-screen flex flex-col">
    <div class="p-4 bg-indigo-600 text-white flex justify-between items-center shadow-md">
        <a href="../index.html">← Voltar</a>
        <h1 class="font-bold">Mestra de Reforço</h1>
    </div>

    <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

    <div class="p-4 bg-white border-t">
        <input type="text" id="input" placeholder="Dúvida do aluno..." class="w-full border p-4 rounded-2xl mb-2 outline-none focus:border-indigo-500">
        <button onclick="enviar()" id="btn" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-bold">Ensinar Agora</button>
    </div>

    <script type="module">
import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";        
        let historico = [];
        const SYSTEM = "Você ajuda uma professora de reforço. Explique para ela (técnico) e para a criança (analogia). direto ao ponto economizando tokens";

        window.enviar = async () => {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");
    const btn = document.getElementById("btn");
    const apiKey = localStorage.getItem("gemini_key");
    
    const texto = input.value;
    if (!texto || !apiKey) return;

    input.value = "";
    btn.disabled = true;

    // 1. Mostra a pergunta do usuário
    chat.innerHTML += `<div class="bg-blue-100 p-3 rounded-lg mb-2"><b>Você:</b> ${texto}</div>`;
    
    // 2. Cria o indicador de aguarde
    const aguarde = document.createElement("div");
    aguarde.id = "status-aguarde";
    aguarde.innerText = "aguarde...";
    aguarde.className = "text-gray-500 italic p-2"; // apenas uma cor cinza discreta
    chat.appendChild(aguarde);
    chat.scrollTop = chat.scrollHeight;

    try {
        const genAI = new GoogleGenerativeAI(apiKey);
        const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash-lite" });
        
        const result = await model.generateContent(texto);
        const response = await result.response;
        const respostaTexto = response.text();

        // 3. Remove o "aguarde..."
        const status = document.getElementById("status-aguarde");
        if (status) status.remove();
        
        // 4. Mostra a resposta
        chat.innerHTML += `<div class="bg-white border p-3 rounded-lg mb-4">${respostaTexto.replace(/\n/g, '<br>')}</div>`;

    } catch (e) {
        const status = document.getElementById("status-aguarde");
        if (status) status.remove();
        alert("Erro: " + e.message);
    } finally {
        btn.disabled = false;
        chat.scrollTop = chat.scrollHeight;
    }
}
    </script>
</body>
</html>
