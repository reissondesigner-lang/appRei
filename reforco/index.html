<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="theme-color" content="#030712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Mestra de Reforço</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background-color: #111827; }
        #app-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        #chat { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 1rem; }
        footer { flex-shrink: 0; background: #111827; border-top: 1px solid #1f2937; padding-bottom: env(safe-area-inset-bottom); }
        .typing-dots { display: inline-flex; align-items: center; gap: 4px; }
        .dot { width: 6px; height: 6px; background: #3b82f6; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
        input { font-size: 16px !important; color: white; }
    </style>
</head>
<body class="text-white">

    <div id="app-container">
        <header class="p-4 flex justify-between items-center border-b border-gray-800 shrink-0" style="background-color: #030712">
            <a href="../index.html" class="text-blue-500 text-sm font-medium">← Voltar</a>
            <h1 class="font-bold">Aula de Reforço</h1>
            <div class="w-10"></div>
        </header>

        <main id="chat" class="space-y-4">
            <div class="bg-gray-800 p-3 rounded-2xl rounded-tl-none text-sm text-gray-400 italic max-w-[85%] border border-gray-700 shadow-sm">
                Olá! Qual assunto você quer aprender hoje?
            </div>
        </main>

        <footer class="p-3">
            <div class="max-w-4xl mx-auto flex items-center gap-2">
                <input type="text" id="input" placeholder="Dúvida do aluno..." 
                       class="flex-1 bg-gray-800 border border-gray-700 p-3 rounded-full outline-none focus:border-blue-500 shadow-sm"
                       autocomplete="off">
                
                <button onclick="enviar()" id="btn" 
                        class="bg-blue-600 text-white p-3 rounded-full w-12 h-12 flex items-center justify-center shadow-lg active:scale-90 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9-2-9-18-9 18 9 2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";        
        import { GEMINI_KEY } from "../config.js";
        // --- PROMPT DE SISTEMA REINSERIDO AQUI ---
        const SYSTEM_PROMPT = "Atue como tutor de reforço: explique conceitos brevemente com termos técnicos leves para a tutora iniciante e analogias lúdicas para um aluno de 5 anos entender, incluindo sempre definição e exemplo. Sempre em português.";

        window.enviar = async () => {
            const input = document.getElementById("input");
            const chat = document.getElementById("chat");
            const btn = document.getElementById("btn");
            
            const texto = input.value.trim();
            if (!texto) return;

            input.value = "";
            btn.disabled = true;

            // Pergunta do Usuário
            chat.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-gray-800 text-gray-400 p-3 rounded-2xl rounded-tr-none max-w-[85%] border border-gray-700 text-sm">
                        <b>Dúvida:</b> ${texto}
                    </div>
                </div>`;
            
            chat.scrollTop = chat.scrollHeight;

            // Indicador de Digitando
            const aguarde = document.createElement("div");
            aguarde.id = "status-aguarde";
            aguarde.className = "flex justify-start";
            aguarde.innerHTML = `
                <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-3">
                    <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                </div>`;
            chat.appendChild(aguarde);
            chat.scrollTop = chat.scrollHeight;

            try {
                const genAI = new GoogleGenerativeAI(GEMINI_KEY);
                const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash-lite" });
                
                // Enviando o Prompt de Sistema + a Pergunta do Usuário
                const promptFinal = `${SYSTEM_PROMPT}\n\nPergunta do aluno: ${texto}`;
                
                const result = await model.generateContent(promptFinal);
                const response = await result.response;
                const respostaTexto = response.text();

                if (document.getElementById("status-aguarde")) document.getElementById("status-aguarde").remove();
                
                // Resposta IA
                chat.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-white text-gray-900 p-4 rounded-2xl rounded-tl-none max-w-[85%] shadow-xl text-sm leading-relaxed">
                            ${respostaTexto.replace(/\n/g, '<br>')}
                        </div>
                    </div>`;

            } catch (e) {
                if (document.getElementById("status-aguarde")) document.getElementById("status-aguarde").remove();
                alert("Erro na API.");
            } finally {
                btn.disabled = false;
                chat.scrollTop = chat.scrollHeight;
                input.focus();
            }
        }

        document.getElementById("input").addEventListener("keypress", (e) => {
            if (e.key === "Enter") window.enviar();
        });

        const vvp = window.visualViewport;
        const appContainer = document.getElementById('app-container');
        function resizeApp() {
            if (!vvp) return;
            appContainer.style.height = vvp.height + 'px';
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }
        if (vvp) {
            vvp.addEventListener('resize', resizeApp);
            window.addEventListener('load', resizeApp);
        }
    </script>
</body>
</html>
