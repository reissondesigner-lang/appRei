<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mestra de Reforço</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        
        .h-dvh { height: 100vh; height: 100dvh; }

        /* Animação de Digitando */
        .typing-dots { display: inline-flex; align-items: center; gap: 4px; }
        .dot {
            width: 6px; height: 6px; background: #4f46e5; border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* Ajuste para não esconder conteúdo atrás da "notch" ou barras do sistema */
        .safe-bottom {
            padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
        }
    </style>
</head>
<body class="bg-indigo-50 text-gray-900 h-dvh flex flex-col">

    <div class="p-4 bg-indigo-600 text-white flex justify-between items-center shadow-md shrink-0">
        <a href="../index.html" class="hover:underline">← Voltar</a>
        <h1 class="font-bold">Aula de Reforço</h1>
    </div>

    <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="bg-indigo-100 p-3 rounded-lg text-sm text-indigo-800 italic">
            Olá! Digite um tema para eu explicar de forma simples.
        </div>
    </div>

    <div class="p-3 bg-white border-t shrink-0 safe-bottom">
        <div class="max-w-4xl mx-auto flex items-center gap-2">
            <input type="search" id="input" placeholder="Dúvida..." 
                   class="flex-1 border p-3 rounded-full outline-none focus:border-indigo-500 shadow-sm bg-gray-50"
                   autocomplete="off" 
                   autocorrect="off" 
                   spellcheck="false"
                   name="q">
            
            <button onclick="enviar()" id="btn" 
                    class="bg-indigo-600 text-white p-3 rounded-full font-bold active:scale-90 transition-transform flex items-center justify-center w-12 h-12 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9-2-9-18-9 18 9 2zm0 0v-8" />
                </svg>
            </button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";        
        
        window.enviar = async () => {
            const input = document.getElementById("input");
            const chat = document.getElementById("chat");
            const btn = document.getElementById("btn");
            const apiKey = localStorage.getItem("gemini_key");
            
            const texto = input.value.trim();
            if (!texto || !apiKey) return;

            input.value = "";
            btn.disabled = true;
            input.focus();

            // 1. Pergunta do usuário
            chat.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-indigo-600 text-white p-3 rounded-2xl rounded-tr-none max-w-[85%] shadow-sm">
                        ${texto}
                    </div>
                </div>`;
            
            // 2. Indicador de digitando
            const aguarde = document.createElement("div");
            aguarde.id = "status-aguarde";
            aguarde.className = "flex justify-start mb-4";
            aguarde.innerHTML = `
                <div class="bg-white border border-indigo-100 p-4 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-3">
                    <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                </div>`;
            chat.appendChild(aguarde);
            chat.scrollTop = chat.scrollHeight;

            try {
                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash-lite" });
                
                const result = await model.generateContent(texto);
                const response = await result.response;
                const respostaTexto = response.text();

                const status = document.getElementById("status-aguarde");
                if (status) status.remove();
                
                chat.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-white border border-indigo-100 p-3 rounded-2xl rounded-tl-none max-w-[85%] shadow-sm leading-relaxed text-gray-800">
                            ${respostaTexto.replace(/\n/g, '<br>')}
                        </div>
                    </div>`;

            } catch (e) {
                const status = document.getElementById("status-aguarde");
                if (status) status.remove();
                alert("Erro: " + e.message);
            } finally {
                btn.disabled = false;
                chat.scrollTop = chat.scrollHeight;
            }
        }

        document.getElementById("input").addEventListener("keypress", (e) => {
            if (e.key === "Enter") window.enviar();
        });
    </script>
</body>
</html>
