<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Mestra de Reforço</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Estrutura infalível para mobile */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Evita o scroll da página inteira */
        }

        body {
            display: flex;
            flex-direction: column;
            /* Suporte para navegadores que não entendem dvh */
            height: 100vh; 
            height: 100dvh; 
        }

        #chat {
            flex: 1 1 auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .footer-container {
            flex: 0 0 auto;
            background: white;
            border-top: 1px solid #e5e7eb;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Esconde ícones chatos de preenchimento do Chrome/Safari */
        input::-webkit-contacts-auto-fill-button,
        input::-webkit-credentials-auto-fill-button {
            visibility: hidden;
            display: none !important;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-indigo-50 text-gray-900">

    <header class="p-4 bg-indigo-600 text-white flex justify-between items-center shadow-md">
        <a href="../index.html">← Voltar</a>
        <h1 class="font-bold text-sm">Mestra de Reforço</h1>
    </header>

    <main id="chat" class="p-4 space-y-4">
        <div class="bg-indigo-100 p-3 rounded-lg text-xs text-indigo-800 italic">
            Olá! O que vamos aprender hoje?
        </div>
    </main>

    <footer class="footer-container">
        <div class="max-w-4xl mx-auto p-3 flex items-center gap-2">
            <input type="text" id="input" placeholder="Dúvida..." 
                   class="flex-1 border p-3 rounded-full outline-none focus:border-indigo-500 shadow-sm bg-gray-50 text-base"
                   autocomplete="off" 
                   autocorrect="off" 
                   spellcheck="false">
            
            <button onclick="enviar()" id="btn" 
                    class="bg-indigo-600 text-white p-3 rounded-full font-bold active:scale-90 transition-transform flex items-center justify-center w-11 h-11 shadow-lg shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9-2-9-18-9 18 9 2zm0 0v-8" />
                </svg>
            </button>
        </div>
    </footer>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";        
        
        window.enviar = async () => {
            const input = document.getElementById("input");
            const chat = document.getElementById("chat");
            const btn = document.getElementById("btn");
            const apiKey = localStorage.getItem("gemini_key");
            
            const texto = input.value.trim();
            if (!texto || !apiKey) return;

            input.value = "";
            btn.disabled = true;

            // Pergunta do usuário
            chat.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-indigo-600 text-white p-3 rounded-2xl rounded-tr-none max-w-[85%] shadow-sm text-sm">
                        ${texto}
                    </div>
                </div>`;
            
            chat.scrollTop = chat.scrollHeight;

            try {
                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash-lite" });
                const result = await model.generateContent(texto);
                const response = await result.response;
                
                chat.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-white border border-indigo-100 p-3 rounded-2xl rounded-tl-none max-w-[85%] shadow-sm text-sm leading-relaxed">
                            ${response.text().replace(/\n/g, '<br>')}
                        </div>
                    </div>`;

            } catch (e) {
                alert("Erro: " + e.message);
            } finally {
                btn.disabled = false;
                chat.scrollTop = chat.scrollHeight;
                // Re-foca o input para manter o teclado aberto (opcional)
                input.focus();
            }
        }

        document.getElementById("input").addEventListener("keypress", (e) => {
            if (e.key === "Enter") window.enviar();
        });
    </script>
</body>
</html>
